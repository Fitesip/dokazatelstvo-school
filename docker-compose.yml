# Продакшен на сервере (Ubuntu + Docker). Инструкция — DEPLOY.md.
# Настройки — в файле .env рядом (образец: .env.production.example).

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/app
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads # картинки к вопросам и решения учеников
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  # HTTPS: как только SITE_ADDRESS — домен, Caddy сам получит сертификат
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Ежедневно: дамп базы и архив загруженных файлов в ./backups, хранятся 14 дней
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          f=/backups/db-$$(date +%Y%m%d-%H%M).sql.gz
          pg_dump -h db -U app app | gzip > "$$f" && echo "бэкап: $$f"
          tar -czf /backups/uploads-$$(date +%Y%m%d-%H%M).tar.gz -C /uploads .
          find /backups \( -name 'db-*.sql.gz' -o -name 'uploads-*.tar.gz' \) -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

  # Разовые команды (создать преподавателя, загрузить демо-каталог):
  #   docker compose run --rm tools npm run teacher:create -- email "Имя" пароль
  tools:
    build:
      context: .
      target: builder
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
